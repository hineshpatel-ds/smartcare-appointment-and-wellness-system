# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected):
#   GCP_PROJECT_ID          - GCP project hosting Cloud Run / GCR
#   GCP_SERVICE_ACCOUNT_KEY - GCP service account JSON key (docker push + terraform google provider)
#   TF_BACKEND_CONFIG       - contents of a backend.hcl (see terraform/backend.hcl.example)
#   TF_VAR_aws_access_key_id, TF_VAR_aws_secret_access_key, TF_VAR_aws_session_token - AWS creds for the aws provider
#   TF_VAR_gcp_project_id, TF_VAR_coordinator_* - see terraform/variables.tf
stages:
  - lint
  - test
  - build
  - plan
  - deploy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  FRONTEND_ROOT: ${CI_PROJECT_DIR}/frontend
  BACKEND_ROOT: ${CI_PROJECT_DIR}/backend
  FRONTEND_IMAGE: gcr.io/${GCP_PROJECT_ID}/saws-frontend:${CI_COMMIT_SHORT_SHA}
  BACKEND_IMAGE: gcr.io/${GCP_PROJECT_ID}/saws-analytics:${CI_COMMIT_SHORT_SHA}

lint_frontend:
  stage: lint
  image: node:20
  script:
    - cd ${FRONTEND_ROOT}
    - npm install
    - npm run lint

test_backend:
  stage: test
  image: node:20
  script:
    - cd ${BACKEND_ROOT}
    - npm install
    - npm test

build_frontend:
  stage: build
  image: node:20
  script:
    - cd ${FRONTEND_ROOT}
    - npm install
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_ROOT}/dist

# Cloud Run serves whatever image tag Terraform points it at, so a deploy
# that never rebuilds/pushes an image is a no-op against stale code. These
# two jobs build+push the image for this commit before the plan/apply stages
# so `TF_VAR_backend_image`/`TF_VAR_frontend_image` can point at fresh code.
build_frontend_image:
  stage: build
  image: google/cloud-sdk:slim
  needs: [lint_frontend]
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud auth configure-docker --quiet
    - docker build -t ${FRONTEND_IMAGE} ${FRONTEND_ROOT}
    - docker push ${FRONTEND_IMAGE}
  only:
    - main
    - merge_requests

build_backend_image:
  stage: build
  image: google/cloud-sdk:slim
  needs: [test_backend]
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud auth configure-docker --quiet
    - docker build -t ${BACKEND_IMAGE} ${BACKEND_ROOT}
    - docker push ${BACKEND_IMAGE}
  only:
    - main
    - merge_requests

terraform_plan:
  stage: plan
  image: hashicorp/terraform:latest
  needs: [build_frontend_image, build_backend_image]
  variables:
    TF_VAR_frontend_image: ${FRONTEND_IMAGE}
    TF_VAR_backend_image: ${BACKEND_IMAGE}
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" > /tmp/gcp-key.json
    - cd ${TF_ROOT}
    - echo "${TF_BACKEND_CONFIG}" > backend.hcl
    - terraform init -backend-config=backend.hcl
    - terraform validate
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 day
  only:
    - main
    - merge_requests

# Real cloud resources cost money and this account uses a fixed, broadly
# permissioned LabRole -- gate the apply behind a manual click rather than
# running it unattended on every push to main.
deploy_infrastructure:
  stage: deploy
  image: hashicorp/terraform:latest
  needs: [terraform_plan]
  variables:
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
  script:
    - echo "${GCP_SERVICE_ACCOUNT_KEY}" > /tmp/gcp-key.json
    - cd ${TF_ROOT}
    - echo "${TF_BACKEND_CONFIG}" > backend.hcl
    - terraform init -backend-config=backend.hcl
    - terraform apply -auto-approve tfplan
  only:
    - main
  when: manual
