openapi: 3.0.3
info:
  title: SmartCare Appointment and Wellness System API
  version: 1.0.0
  description: REST API for SAWS authentication, services, appointments, support messaging, chatbot, feedback, and analytics.
servers:
  - url: https://saws-api-474600405419.us-central1.run.app
    description: Deployed Cloud Run API
  - url: http://localhost:8080
    description: Local API
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API status
  /services:
    get:
      summary: List public healthcare and wellness services
      responses:
        "200":
          description: Service list
    post:
      summary: Add or update a service offering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceWrite"
      responses:
        "200":
          description: Saved service
        "403":
          description: Coordinator access required
  /services/{serviceId}:
    put:
      summary: Update a service offering by ID
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceWrite"
      responses:
        "200":
          description: Saved service
        "403":
          description: Coordinator access required
  /auth/register:
    post:
      summary: Register a patient or coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration started
  /auth/register/confirm:
    post:
      summary: Confirm registration code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, confirmationCode]
              properties:
                userId:
                  type: string
                confirmationCode:
                  type: string
      responses:
        "200":
          description: Confirmed
  /auth/login/start:
    post:
      summary: Login stage 1, user ID and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, password]
              properties:
                userId:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Security question challenge
  /auth/login/security-question:
    post:
      summary: Login stage 2, security answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, answer]
              properties:
                userId:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Caesar cipher challenge
  /auth/login/cipher:
    post:
      summary: Login stage 3, healthcare code cipher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, healthcareCode]
              properties:
                userId:
                  type: string
                healthcareCode:
                  type: string
      responses:
        "200":
          description: Authenticated user context
  /appointments:
    post:
      summary: Book an upcoming appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "200":
          description: Appointment created
        "400":
          description: Required field missing or appointment is not upcoming
    get:
      summary: List role-scoped appointments
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [patient, coordinator]
      responses:
        "200":
          description: Appointment list
        "401":
          description: Authentication required
  /appointments/{appointmentId}:
    patch:
      summary: Coordinator updates appointment status
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, userId, role]
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, REJECTED, CANCELLED]
                userId:
                  type: string
                role:
                  type: string
                  enum: [coordinator]
      responses:
        "200":
          description: Updated appointment
        "403":
          description: Coordinator access required
  /messages/support:
    post:
      summary: Submit a support concern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCreate"
      responses:
        "200":
          description: Support message created
  /messages:
    get:
      summary: List role-scoped support messages
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [patient, coordinator]
      responses:
        "200":
          description: Message list
        "401":
          description: Authentication required
  /messages/{messageId}/reply:
    post:
      summary: Coordinator replies to support message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, userId, role]
              properties:
                body:
                  type: string
                status:
                  type: string
                userId:
                  type: string
                role:
                  type: string
                  enum: [coordinator]
      responses:
        "200":
          description: Reply saved
        "403":
          description: Coordinator access required
  /feedback:
    post:
      summary: Submit structured feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreate"
      responses:
        "200":
          description: Feedback saved
  /analyze:
    post:
      summary: Analyze text sentiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Sentiment score
  /analytics/summary:
    get:
      summary: Get role-scoped analytics
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [patient, coordinator]
      responses:
        "200":
          description: Analytics summary
        "401":
          description: Authentication required
  /chatbot:
    post:
      summary: Ask the virtual assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                userId:
                  type: string
      responses:
        "200":
          description: Assistant reply
components:
  schemas:
    RegisterRequest:
      type: object
      required: [userId, email, password, role, securityQuestion, securityAnswer, healthcareCode]
      properties:
        userId:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [patient, coordinator]
        securityQuestion:
          type: string
        securityAnswer:
          type: string
        healthcareCode:
          type: string
    ServiceWrite:
      type: object
      required: [name, userId, role]
      properties:
        serviceId:
          type: string
        name:
          type: string
        category:
          type: string
        specialist:
          type: string
        price:
          type: number
        durationMinutes:
          type: number
        availability:
          type: string
        description:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [coordinator]
    AppointmentCreate:
      type: object
      required: [userId, date, time, service]
      properties:
        userId:
          type: string
        service:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        notes:
          type: string
    SupportCreate:
      type: object
      required: [message]
      properties:
        userId:
          type: string
        subject:
          type: string
        message:
          type: string
    FeedbackCreate:
      type: object
      required: [userId, service, rating, comment]
      properties:
        userId:
          type: string
        service:
          type: string
        rating:
          type: number
        comment:
          type: string
